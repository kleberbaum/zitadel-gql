version: v2
clean: true
inputs:
  # The protos live in this same repository, one directory up. Before the
  # facade moved into the fork this pulled a pinned tarball over HTTP, which
  # meant a sha to keep in step by hand and a codegen step that needed the
  # network. In-tree, the generated clients cannot drift from the server they
  # front: both come from the same commit by construction.
  - directory: ../proto
plugins:
  - remote: buf.build/bufbuild/es:v2.13.0
    out: src/proto
    include_imports: true
    opt: [target=ts, json_types=true]
